version = 1
revision = 5
requires-python = ">=3.11"
resolution-markers = [
    "python_full_version == '3.12.*' and platform_machine == 'aarch64' and sys_platform == 'linux'",
]
supported-markers = [
    "python_full_version == '3.12.*' and platform_machine == 'aarch64' and sys_platform == 'linux'",
]

[manifest]
constraints = [
    { name = "mako", specifier = ">=1.3.12" },
    { name = "msgpack", specifier = ">=1.2.1" },
    { name = "pillow", specifier = ">=12.3.0" },
    { name = "pydantic-settings", specifier = ">=2.14.2" },
    { name = "pygments", specifier = ">=2.20.0" },
    { name = "starlette", specifier = ">=1.3.1" },
    { name = "torch", marker = "(platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'arm64' and sys_platform == 'linux') or (platform_machine == 'aarch64' and sys_platform == 'win32') or (platform_machine == 'arm64' and sys_platform == 'win32') or (sys_platform != 'linux' and sys_platform != 'win32')", specifier = "==2.8.0" },
    { name = "torch", marker = "(platform_machine != 'aarch64' and platform_machine != 'arm64' and sys_platform == 'linux') or (platform_machine != 'aarch64' and platform_machine != 'arm64' and sys_platform == 'win32')", specifier = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" },
    { name = "torchaudio", marker = "(platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'arm64' and sys_platform == 'linux') or (platform_machine == 'aarch64' and sys_platform == 'win32') or (platform_machine == 'arm64' and sys_platform == 'win32') or (sys_platform != 'linux' and sys_platform != 'win32')", specifier = "==2.8.0" },
    { name = "torchaudio", marker = "(platform_machine != 'aarch64' and platform_machine != 'arm64' and sys_platform == 'linux') or (platform_machine != 'aarch64' and platform_machine != 'arm64' and sys_platform == 'win32')", specifier = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" },
    { name = "torchvision", marker = "(platform_machine == 'aarch64' and sys_platform == 'linux') or (platform_machine == 'arm64' and sys_platform == 'linux') or (platform_machine == 'aarch64' and sys_platform == 'win32') or (platform_machine == 'arm64' and sys_platform == 'win32') or (sys_platform != 'linux' and sys_platform != 'win32')", specifier = "==0.23.0" },
    { name = "torchvision", marker = "(platform_machine != 'aarch64' and platform_machine != 'arm64' and sys_platform == 'linux') or (platform_machine != 'aarch64' and platform_machine != 'arm64' and sys_platform == 'win32')", specifier = "==0.23.0", index = "https://download.pytorch.org/whl/cu128" },
]

